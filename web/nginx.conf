# Веб-интерфейс: статика из /usr/share/nginx/html + прокси /api/ -> booking-service:8080.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Встроенный DNS Docker. Имя upstream'а резолвится при запросе (через переменную),
    # поэтому nginx стартует, даже если booking-service ещё не поднят.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $booking_service http://booking-service:8080;

    location / {
        try_files $uri $uri/ /index.html;
        # Статика без сборки и хешей в именах - пусть браузер всегда перепроверяет.
        add_header Cache-Control "no-cache" always;
    }

    # /api/flights?origin=... -> http://booking-service:8080/flights?origin=...
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $booking_service;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Ответы сервиса (в т.ч. 4xx/5xx с JSON-телом) отдаются клиенту как есть.
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;

        # Ошибки самого прокси (сервис не запущен/не отвечает) - в том же JSON-формате.
        error_page 502 = @booking_unavailable;
        error_page 504 = @booking_timeout;
    }

    location @booking_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":{"code":"BOOKING_SERVICE_UNAVAILABLE","message":"Booking Service is unavailable"}}';
    }

    location @booking_timeout {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"Booking Service did not respond in time"}}';
    }
}
